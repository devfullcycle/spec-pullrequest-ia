services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    # Faz o contêiner parado encerrar na hora no `down`.
    init: true
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    init: true
    ports:
      # Na máquina a API fica na 3001; entre contêineres, em http://api:3000.
      - "3001:3000"
    volumes:
      - ./apps/api:/app
